{% extends "base.html" %}
{% set hide_nav = true %}

{% block title %}Login — Study Planner{% endblock %}
{% block body_class %}login-page{% endblock %}

{% block style %}
<style>
  body.login-page {
    display:flex; align-items:center; justify-content:center;
    padding:24px 16px;
  }
  body.login-page .container { --container-w:360px; width:100%; }
  .login-box {
    background:var(--surface); border:1px solid var(--border-light);
    border-top:2px solid var(--blue); padding:40px 36px;
  }
  .login-title {
    font-family:var(--font-mono); font-size:11px; letter-spacing:3px;
    text-transform:uppercase; color:var(--blue); margin-bottom:6px;
  }
  .login-sub {
    font-family:var(--font-mono); font-size:10px; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--text-dim); margin-bottom:28px;
  }
  .login-box input[type="password"] {
    font-family:var(--font-mono); font-size:14px; margin-bottom:20px;
  }
  .login-box .btn { width:100%; }
</style>
{% endblock %}

{% block content %}
<div class="login-box">
  <div class="login-title">Study Planner</div>
  <div class="login-sub">Private Access</div>
  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <label>Password</label>
    <input type="password" name="password" autofocus autocomplete="current-password">
    <button type="submit" class="btn btn-primary">Enter →</button>
  </form>
</div>
{% endblock %}
